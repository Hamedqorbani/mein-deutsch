name: Deploy Mein Deutsch to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate project scripts and past-tense data
        run: node tests/validate-past-tense.js
      - name: Validate interface localization
        run: node tests/validate-localization.js
      - name: Validate source-based Starten wir lesson labels
        run: node tests/validate-lesson-labels.js
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
